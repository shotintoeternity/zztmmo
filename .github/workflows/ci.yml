name: CI

on:
  push:
  pull_request:

# One run per branch. A second push supersedes the first, and the first is
# cancelled rather than left to finish: `parity` alone can take a quarter of an
# hour and is capped at sixty minutes, so two pushes a minute apart used to
# leave two of them racing for a runner over a commit nobody was waiting on any
# more. That happened twice on 2026-09-08.
#
# Keyed by ref, so branches never cancel each other, and a pull request's run is
# separate from the branch push that produced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # go-version is pinned here, NOT read from go.mod: engine/go.mod says
      # `go 1.16`, which is the language floor go:embed required, not the
      # toolchain. The baseline was verified on go1.26.5 (TASKS.md line 14).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: engine/go.sum
      - run: go build ./...
        working-directory: engine
      - run: go vet ./...
        working-directory: engine
      - run: go test ./...
        working-directory: engine

  engine-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required job: the default-instance room-lifecycle race is fixed (M13.4,
    # NOTES.md 2026-07-12). The whole world ticks through one lock per instance,
    # so `go test -race ./...` must stay green.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: engine/go.sum
      - run: go test -race ./...
        working-directory: engine

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: engine/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser-goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # M16.9's real-browser visual parity harness. It has its own job because it
    # needs node_modules and a pinned Chromium, which the `engine` job above
    # deliberately does not install — the Go tests skip themselves when the
    # harness is absent rather than reddening a checkout that never asked for a
    # browser. On failure the cell diff and the actual/expected/diff PNGs are
    # uploaded: a golden failure is a picture, and reading it as a log is
    # hopeless.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: engine/web/package-lock.json
      - run: npm ci
        working-directory: engine/web
      # The three engines are ~400MB and are re-downloaded on every run
      # otherwise. The key is the lockfile's hash rather than the Playwright
      # version parsed out of it: a lockfile change busts the browser cache even
      # when Playwright itself did not move, which costs one slow run and needs
      # no script that can go stale. A miss just downloads them as before, so a
      # clean clone still certifies itself.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('engine/web/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      # Firefox and WebKit are here for M16.18's device/browser matrix, which
      # certifies the client on all three desktop engines. The golden suites use
      # Chromium alone; installing the other two costs about a minute and is what
      # keeps the matrix from being a matrix in name only.
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: engine/web
      - run: npm run build
        working-directory: engine/web
      # ZZT_BROWSER=1 is what asks for the real-browser suites: they are opt-in
      # for everyday runs (owner decision 2026-08-01) so a one-line engine change
      # does not pay eleven Playwright suites, and mandatory under `make certify`.
      # Without it this job would run and report nothing.
      - run: go test -count=1 -run 'TestM169|TestM1610|TestM1613|TestM1614|TestM1618' -v ./...
        working-directory: engine
        env:
          ZZT_BROWSER: '1'
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-golden-artifacts
          path: |
            engine/web/test-results/**
          if-no-files-found: ignore

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The single M16 certification command (task M16.1, extended by M16.20). It
    # runs every clean gate — including the real-browser track, which is why the
    # Playwright engines are installed by the command itself rather than by a
    # step here — and emits a deterministic report keyed by the parity manifest.
    # `-require-certified` makes an uncertified manifest a failure: M16.20 has
    # landed, so a row falling back to `unverified` or a suite skipping itself
    # must redden this job rather than pass quietly. The tree is asserted clean:
    # the command writes only gitignored files. Aggregate line coverage is
    # deliberately never computed here — parity is proven row by row in the
    # manifest, not by a coverage percentage.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: engine/web/package-lock.json
      # The three engines are ~400MB and are re-downloaded on every run
      # otherwise. The key is the lockfile's hash rather than the Playwright
      # version parsed out of it: a lockfile change busts the browser cache even
      # when Playwright itself did not move, which costs one slow run and needs
      # no script that can go stale. A miss just downloads them as before, so a
      # clean clone still certifies itself.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('engine/web/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      # The engines' OS dependencies only; the browsers themselves are installed
      # by the parity command, which is what makes a clean clone's certification
      # run self-contained. With the cache above warm, that install finds them
      # already on disk and downloads nothing.
      - run: npx playwright install-deps chromium firefox webkit
        working-directory: engine/web
      - run: make certify
      - name: Assert clean tree
        run: |
          if [ -n "$(git status --short)" ]; then
            echo "parity command dirtied the working tree:"
            git status --short
            exit 1
          fi
      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          # The manifest and the report are the claim; run.json carries the
          # tool/environment hashes and per-gate timings, load-metrics.txt the
          # bounded-load run's measured numbers, and test-results the browser
          # diffs and traces (task M16.20).
          path: |
            fixtures/parity/manifest.json
            fixtures/parity/device-matrix.json
            fixtures/parity/report.json
            fixtures/parity/report.md
            fixtures/parity/run.json
            fixtures/parity/load-metrics.txt
            engine/web/test-results/**
          if-no-files-found: warn
